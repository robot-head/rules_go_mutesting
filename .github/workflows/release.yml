name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach_archive:
    name: Attach the source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      # The Bazel Central Registry rejects GitHub's auto-generated tag
      # tarballs because their checksums are not stable. Building the archive
      # here, with gzip -n so no timestamp is embedded, gives the registry a
      # byte-reproducible URL to record an integrity hash against.
      - name: Build a reproducible source archive
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          PREFIX="${GITHUB_REPOSITORY##*/}-${VERSION}"
          git archive --format=tar --prefix="${PREFIX}/" "${TAG}" \
            | gzip -n -9 > "${PREFIX}.tar.gz"
          echo "Integrity: sha256-$(openssl dgst -sha256 -binary "${PREFIX}.tar.gz" | base64)"
          echo "ARCHIVE=${PREFIX}.tar.gz" >> "$GITHUB_ENV"
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${ARCHIVE}" --clobber
